# Daily: read new channel posts, add titles typed on the site, rebuild the catalog, publish.
# Also runs from the "Обновить" button on the site (workflow_dispatch).
name: Обновление каталога

on:
  schedule:
    - cron: "0 4 * * *"   # каждый день в 07:00 по Минску
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install telethon certifi

      - name: Кэш ответов TMDB, OMDb и других сервисов
        uses: actions/cache@v4
        with:
          path: data/cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-

      - name: Обновить каталог
        run: python scripts/update.py
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          KINOPOISK_KEY: ${{ secrets.KINOPOISK_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Сохранить изменения
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data/manual_titles.txt data/sources.json data/draft.json data/draft.md site/data/catalog.json
          git diff --cached --quiet || git commit -m "Обновление каталога $(date -u +%F)"
          # если за время обновления в репозиторий что-то отправили — подтягиваем и пробуем снова
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done

      - name: Метка версии против старого кэша
        run: sed -i "s/?v=dev/?v=${{ github.run_number }}/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
